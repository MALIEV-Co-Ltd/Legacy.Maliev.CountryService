name: Country source parity

on:
  pull_request:
    branches: [main]
    paths:
      - 'Legacy.Maliev.CountryService.Api/Controllers/CountriesController.cs'
      - 'Legacy.Maliev.CountryService.Tests/Integration/CountryLegacyIdentifierHttpTests.cs'
      - '.github/workflows/source-parity-validation.yml'
      - 'scripts/verify-source-parity-coverage.py'
  push:
    branches: [main]
    paths:
      - 'Legacy.Maliev.CountryService.Api/Controllers/CountriesController.cs'
      - 'Legacy.Maliev.CountryService.Tests/Integration/CountryLegacyIdentifierHttpTests.cs'
      - '.github/workflows/source-parity-validation.yml'
      - 'scripts/verify-source-parity-coverage.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: source parity
    runs-on: ubuntu-latest
    env:
      MalievWorkspaceRoot: ${{ github.workspace }}/.dependencies
      VSTestCollect: XPlat Code Coverage
      VSTestLogger: trx
      VSTestResultsDirectory: ${{ github.workspace }}/source-parity-results
    steps:
      - name: Check out CountryService
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out Legacy.Maliev.ServiceDefaults
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.ServiceDefaults
          ref: 8f4f5f27b226ffe406c4c79b1903742e8c2e7dd3
          path: .dependencies/Legacy.Maliev.ServiceDefaults
          persist-credentials: false
      - name: Check out Legacy.Maliev.CompatibilityContracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.CompatibilityContracts
          ref: 78e48ffc4ee000df0510cba5e7c7a3c4c4d539d7
          path: .dependencies/Legacy.Maliev.CompatibilityContracts
          persist-credentials: false
      - name: Validate .NET solution
        uses: MALIEV-Co-Ltd/Legacy.Maliev.Workflows/actions/dotnet-validate@73dd7304ffe85ec504389fd7664cc39070b9f148
        with:
          solution: Legacy.Maliev.CountryService.slnx
          use-local-maliev-dependencies: 'true'
      - name: Gate raw owned production coverage
        run: python3 scripts/verify-source-parity-coverage.py source-parity-results
      - name: Preserve source parity receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: country-source-parity-${{ github.sha }}
          path: source-parity-results
          if-no-files-found: error
          retention-days: 7
