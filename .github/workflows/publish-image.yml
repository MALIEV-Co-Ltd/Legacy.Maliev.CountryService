name: Publish immutable image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-gate:
    if: vars.LEGACY_DEPLOY_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Record planned-only state
        run: echo "Deployment remains gated until migration, parity, rollback, capacity, secrets, WIF, GitOps and staging gates pass."

  publish:
    permissions:
      contents: read
      id-token: write
    if: vars.LEGACY_DEPLOY_ENABLED == 'true'
    uses: MALIEV-Co-Ltd/Legacy.Maliev.Workflows/.github/workflows/publish-image.yml@dfea9b89226b6fc0c2885c4a7c4212497d846a89
    with:
      image: ${{ vars.LEGACY_ARTIFACT_REGISTRY }}/legacy-maliev-country-service
      dockerfile: Legacy.Maliev.CountryService.Api/Dockerfile
      context: .
      legacy-service-defaults-ref: cfc8053d316c55353841092429985a9f76f17d8d
      compatibility-contracts-ref: 78e48ffc4ee000df0510cba5e7c7a3c4c4d539d7
      environment: legacy-production
      workload-identity-provider: ${{ vars.LEGACY_WORKLOAD_IDENTITY_PROVIDER }}
      service-account: ${{ vars.LEGACY_COUNTRY_PUBLISHER_SERVICE_ACCOUNT }}
